name: RaceDay Part 1 Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-part1:
    name: Validate RaceDay Part 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          test -d docs || {
            echo "ERROR: docs folder is missing"
            exit 1
          }
          echo "docs folder found"

      - name: Check RaceDay ERD
        run: |
          test -f docs/RaceDay_ERD.png || {
            echo "ERROR: RaceDay_ERD.png is missing"
            exit 1
          }
          echo "RaceDay ERD found"

      - name: Check API Endpoint Plan
        run: |
          test -f docs/API_Endpoint_Plan.pdf || {
            echo "ERROR: API_Endpoint_Plan.pdf is missing"
            exit 1
          }
          echo "API Endpoint Plan found"

      - name: Check SQL Database Script
        run: |
          test -f docs/RaceDay_Database_Script.sql || {
            echo "ERROR: RaceDay_Database_Script.sql is missing"
            exit 1
          }
          echo "SQL database script found"

      - name: Check README
        run: |
          test -f README.md || {
            echo "ERROR: README.md is missing"
            exit 1
          }
          echo "README found"

      - name: Validation complete
        run: echo "RaceDay Part 1 repository validation completed successfully."
